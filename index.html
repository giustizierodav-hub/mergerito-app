<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mergerito</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mergerito">
<meta name="theme-color" content="#030504">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icona.png">
<style>
@font-face { font-family: "Martian Mono"; src: url("martian-mono.ttf") format("truetype"); font-weight: 100 800; font-display: swap; }
/* Mergerito su iPhone: stessa faccia dell'app del Mac — fondo quasi nero, verde terminale, colonna unica. */
:root {
  --bg: #030504; --win: #080c0a; --card: #060a08; --line: #1b2a22; --line2: #22362b;
  --text: #d3ded7; --bright: #e6efe9; --gray: #8a968f; --dim: #6e7d74;
  --green: #3dff8f; --amber: #f5a524; --arancio: #ff9f43; --red: #ff6b5e; --viola: #b784ff; --sel: #0a1610;
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sans: -apple-system, system-ui, "Helvetica Neue", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans); min-height: 100vh;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-bottom: 92px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; border-bottom: 1px solid var(--line); }
.logo { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line2); flex: none; }
.brand { font: 700 18px/1 var(--mono); color: var(--bright); letter-spacing: -.01em; }
.brand::after { content: "_"; color: var(--green); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .brand::after { animation: none } }
.sub { font: 400 11.5px/1.35 var(--mono); color: var(--gray); margin-top: 4px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }
.dot.warn { background: var(--amber); } .dot.err { background: var(--red); }
.ref { margin-left: auto; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line2); background: var(--win); display: grid; place-items: center; }
.ref svg { width: 18px; height: 18px; stroke: var(--green); }
.ref.spin svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }

.banner { margin: 12px 0 0; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 8px; font: 12.5px/1.4 var(--mono); color: var(--text); background: var(--win); display: flex; gap: 10px; align-items: flex-start; }
.banner b { color: var(--bright); }
.banner.warn { border-color: #5a4512; } .banner.warn::before { content: "!"; color: var(--amber); font-weight: 800; }
.banner.err { border-color: #5c2621; } .banner.err::before { content: "×"; color: var(--red); font-weight: 800; }
.banner.ok::before { content: "✓"; color: var(--green); font-weight: 800; }

h2 { font: 600 11px/1 var(--mono); color: var(--dim); letter-spacing: .14em; text-transform: uppercase; margin: 22px 0 8px; }
h2::before { content: "// "; color: var(--line2); }

/* elenco giornate */
.list { border-left: 2px solid var(--line); margin-left: 3px; }
.mese { font: 600 11px/1 var(--mono); color: var(--gray); letter-spacing: .12em; text-transform: uppercase; padding: 16px 0 6px 12px; }
.row { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 9px 0 9px 12px; border-bottom: 1px solid #0d1511; position: relative; }
.row.oggi::before { content: ""; position: absolute; left: -2px; top: 0; bottom: 0; width: 2px; background: var(--green); }
.when { font: 600 13px/1.35 var(--sans); color: var(--gray); font-variant-numeric: tabular-nums; }
.when .wd { color: var(--dim); font-weight: 400; display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
.what { min-width: 0; }
.tit { display: flex; align-items: center; gap: 7px; font-weight: 600; color: var(--bright); line-height: 1.3; }
.tit .az { font-family: var(--sans); font-weight: 700; font-size: 16px; }
.tit .resto { color: var(--bright); font-weight: 500; overflow-wrap: anywhere; }
.sq { width: 11px; height: 11px; border-radius: 2.5px; flex: none; }
.sq.in_calendario { background: var(--green); } .sq.richiesta { background: var(--amber); } .sq.mancante { background: var(--red); } .sq.viaggio { background: var(--viola); }
.meta { font: 11.5px/1.4 var(--mono); color: var(--dim); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
.tag { font: 600 10px/1 var(--mono); padding: 3px 5px; border-radius: 3px; border: 1px solid var(--line2); color: var(--gray); letter-spacing: .04em; }
.tag.live { color: var(--green); border-color: #1d5a37; }
.tag.nuova { color: var(--amber); border-color: #5a4512; }
.vuoto { color: var(--dim); font: 13px/1.5 var(--mono); padding: 18px 12px; }


/* calendario mensile */
.mesebar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin: 14px 0 8px; }
.freccia { height: 44px; border-radius: 10px; border: 1px solid var(--line2); background: var(--win); color: var(--green); font: 400 26px/1 var(--mono); }
.mtit { background: none; border: 0; font: 700 15px/1 var(--mono); color: var(--bright); text-transform: uppercase; letter-spacing: .12em; }
.mtit span { color: var(--green); }
.griglia { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.gg, .sett { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.gg span { font: 700 11.5px/1 var(--sans); color: var(--dim); text-align: center; padding: 8px 0; letter-spacing: .08em; border-bottom: 1px solid var(--line); }
.gg span.we { color: var(--gray); }
.cella { min-height: var(--alt, 57px); background: none; border: 0; border-right: 1px solid #0d1511; border-bottom: 1px solid #0d1511; padding: 4px 0 4px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; color: var(--text); }
.sett .cella:nth-child(7) { border-right: 0; }
.cella.we { background: rgba(255,255,255,.012); }
.cella .num { font: 700 13px/1 var(--sans); color: var(--text); padding: 3px 0 3px 6px; font-variant-numeric: tabular-nums; }
.cella.fuori .num { color: #37443d; }
.cella.passato .num { color: var(--dim); }
.cella.oggi { background: rgba(255, 159, 67, .2); }
.cella.oggi .num { color: var(--bg); background: var(--arancio); border-radius: 5px; padding: 3px 5px; margin-left: 3px; align-self: flex-start; }
.cella.sel { box-shadow: inset 0 0 0 1.5px var(--green); }
.cella.sel:not(.oggi) { background: var(--sel); }
.sett { position: relative; }
.barra { position: absolute; height: 25px; padding: 0 4px; font: 600 11px/1 var(--sans); letter-spacing: -.01em; color: var(--tc, #0b0f0d); background: var(--c); overflow: hidden; pointer-events: none; display: flex; align-items: center; gap: 4px; border-radius: 0; }
.barra b { font-weight: 600; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.barra.uno { padding: 0 3px; }
.barra.uno b { white-space: normal; line-height: 11.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: normal; word-break: break-word; font-size: 10px; }
.barra.uno .sq { display: none; }
.barra.uno { box-shadow: inset 0 -3px 0 var(--st, transparent); }
.barra.a { border-top-left-radius: 5px; border-bottom-left-radius: 5px; }
.barra.b { border-top-right-radius: 5px; border-bottom-right-radius: 5px; }
.barra.dec { background: transparent; box-shadow: inset 0 0 0 1px var(--c); color: var(--c); }
.barra .sq { flex: none; width: 8px; height: 8px; border-radius: 2px; box-shadow: 0 0 0 1px #0b0f0d; }
.altri { font: 600 9px/1 var(--mono); color: var(--gray); padding-left: 6px; margin-top: auto; }


/* viaggi */
.card { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.cards { display: grid; gap: 10px; }
.v-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.v-data { font: 600 13px/1.2 var(--mono); color: var(--bright); }
.v-tipo { font: 600 10.5px/1 var(--mono); color: var(--viola); letter-spacing: .1em; text-transform: uppercase; }
.v-tratta { font-size: 16px; color: var(--bright); font-weight: 500; }
.v-tratta span { color: var(--viola); padding: 0 4px; }
.v-occ { font: 12px/1.4 var(--mono); color: var(--amber); }
.scelte { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line2); background: transparent; font: 600 12px/1 var(--mono); letter-spacing: .06em; color: var(--gray); }
.btn.on { color: var(--green); border-color: var(--green); background: rgba(61,255,143,.08); }
.btn.on.no { color: var(--red); border-color: var(--red); background: rgba(255,107,94,.08); }
.btn.prim { color: var(--bg); background: var(--green); border-color: var(--green); }
.btn.prim:disabled { opacity: .35; }
.btn.wide { width: 100%; min-height: 46px; font-size: 13px; }
.attesa { font: 12px/1.4 var(--mono); color: var(--amber); }

/* consuntivi */
.tab { width: 100%; border-collapse: collapse; font: 12.5px/1.35 var(--mono); font-variant-numeric: tabular-nums; }
.tab td, .tab th { padding: 8px 6px; border-bottom: 1px solid #0d1511; text-align: left; vertical-align: top; }
.tab th { color: var(--dim); font-weight: 600; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
.tab td.n, .tab th.n { text-align: right; white-space: nowrap; }
.tab td.d { color: var(--gray); white-space: nowrap; }
.tab .dsc { color: var(--bright); font-family: var(--sans); font-size: 13.5px; }
.tab .loc { color: var(--dim); font-size: 11.5px; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.tot { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 10px; }
.tot div { background: var(--card); padding: 10px 8px; }
.tot small { display: block; font: 600 9.5px/1 var(--mono); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
.tot b { display: block; font: 600 15px/1.2 var(--mono); color: var(--bright); margin-top: 6px; font-variant-numeric: tabular-nums; }
.tot div:last-child b { color: var(--green); }
.nota { font: 12px/1.5 var(--mono); color: var(--dim); margin-top: 8px; }

/* impostazioni */
.campo { display: grid; gap: 6px; }
.campo label { font: 600 11px/1 var(--mono); color: var(--gray); letter-spacing: .08em; text-transform: uppercase; }
.campo input { min-height: 44px; border-radius: 6px; border: 1px solid var(--line2); background: var(--win); padding: 0 12px; font: 15px var(--mono); color: var(--bright); width: 100%; }
.campo .aiuto { font: 11.5px/1.45 var(--mono); color: var(--dim); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font: 12.5px/1.4 var(--mono); }
.kv dt { color: var(--dim); } .kv dd { margin: 0; color: var(--bright); text-align: right; overflow-wrap: anywhere; }
.link { background: none; border: 0; color: var(--gray); font: 12px var(--mono); text-decoration: underline; padding: 8px 0; }

/* blocco */
.lock { min-height: 80vh; display: grid; align-content: center; gap: 16px; }
.lock p { color: var(--gray); font: 13px/1.55 var(--mono); margin: 0; }
.lock .err { color: var(--red); }

/* barra in basso */
nav.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: rgba(3,5,4,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.bar button { background: none; border: 0; min-height: 50px; font: 600 10px/1 var(--mono); letter-spacing: .08em; color: var(--dim); display: grid; justify-items: center; gap: 6px; position: relative; }
nav.bar button svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; }
nav.bar button[aria-current="page"] { color: var(--green); }
nav.bar .badge { position: absolute; top: 3px; left: calc(50% + 6px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--amber); color: var(--bg); font: 800 10px/17px var(--mono); padding: 0 4px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="bar" id="bar" hidden>
  <button data-v="cal" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>CALENDARIO</button>
  <button data-v="cons"><svg viewBox="0 0 24 24"><path d="M6 3.5h9l3 3V20.5H6z"/><path d="M9 11h6M9 15h6"/></svg>CONSUNTIVI<span class="badge" id="bc" hidden></span></button>
  <button data-v="stato"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M5.5 18.5l2.1-2.1M16.4 7.6l2.1-2.1"/></svg>STATO</button>
</nav>
<script>
"use strict";
// ---------------------------------------------------------------- memoria del telefono
const K = { frase: "mg_frase", token: "mg_token", repo: "mg_repo", cache: "mg_cache", hb: "mg_hb", attesa: "mg_attesa", vista: "mg_vista" };
const get = (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
const set = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} };
const getJ = (k, d) => { try { return JSON.parse(get(k)) ?? d; } catch { return d; } };

const S = { dati: null, live: null, liveErr: "", errore: "", carico: false, vista: get(K.vista) || "cal", scelte: {}, frase: get(K.frase), invio: "" };

// ---------------------------------------------------------------- dove sono i dati
function repo() {
  const q = new URLSearchParams(location.search).get("repo");
  if (q) return q;
  if (get(K.repo)) return get(K.repo);
  const h = location.hostname;
  if (h.endsWith(".github.io")) {
    const u = h.slice(0, -10);
    // la pagina sta nell'archivio pubblico "<nome>-app", i dati in quello privato "<nome>"
    const p = location.pathname.split("/").filter(Boolean)[0];
    const r = p && !p.includes(".") ? p : h;
    return `${u}/${r.replace(/-app$/, "")}`;
  }
  return "";
}
const API = "https://api.github.com";

async function scaricaDati() {
  const r = repo(), t = get(K.token);
  if (!r) throw new Error("manca il nome dell'archivio dei dati");
  if (!t) throw new Error("manca il token GitHub");
  let res;
  try {
    res = await fetch(`${API}/repos/${r}/contents/dati.json?t=${Date.now()}`, { headers: { Authorization: `Bearer ${t}`, Accept: "application/vnd.github.raw+json" }, cache: "no-store" });
  } catch (e) { throw new Error("nessuna connessione a GitHub"); }
  if (res.ok) return await res.text();
  if (res.status === 401) throw new Error("token GitHub non valido o scaduto");
  if (res.status === 404) throw new Error(`dati non trovati in ${r}: controlla il nome dell'archivio, o premi SALVA E CARICA sul Mac`);
  throw new Error(`GitHub ha risposto ${res.status}`);
}

// ---------------------------------------------------------------- cifratura (uguale al Mac)
const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64e = (u) => { let s = ""; u.forEach((b) => (s += String.fromCharCode(b))); return btoa(s); };
async function chiave(frase, sale, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(frase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: sale, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function decifra(frase, testo) {
  const v = JSON.parse(testo);
  const k = await chiave(frase, b64d(v.sale), v.iter || 200000);
  try {
    const out = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(v.iv) }, k, b64d(v.dati));
    return JSON.parse(new TextDecoder().decode(out));
  } catch { throw new Error("frase segreta sbagliata"); }
}
async function cifra(frase, obj) {
  const sale = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await chiave(frase, sale, 200000);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({ v: 1, iter: 200000, sale: b64e(sale), iv: b64e(iv), dati: b64e(new Uint8Array(ct)) });
}

// ---------------------------------------------------------------- TeamHB dal telefono
async function hbToken(d) {
  const st = getJ(K.hb, null);
  if (!st || !st.refresh || !d.teamhb || !d.teamhb.base) return null;
  if (st.access && st.scade > Date.now() / 1000 + 60) return st.access;
  const r = await fetch(`${d.teamhb.base}/auth/v1/token?grant_type=refresh_token`, { method: "POST", headers: { apikey: d.teamhb.key, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: st.refresh }) });
  if (!r.ok) { set(K.hb, ""); throw new Error("accesso a TeamHB scaduto: rientra da STATO"); }
  const v = await r.json();
  set(K.hb, JSON.stringify({ refresh: v.refresh_token, access: v.access_token, scade: v.expires_at || Date.now() / 1000 + 3000 }));
  return v.access_token;
}
async function hbLogin(d, email, password) {
  const r = await fetch(`${d.teamhb.base}/auth/v1/token?grant_type=password`, { method: "POST", headers: { apikey: d.teamhb.key, "Content-Type": "application/json" }, body: JSON.stringify({ email, password }) });
  const v = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(v.error_description || v.msg || `login non riuscito (${r.status})`);
  set(K.hb, JSON.stringify({ refresh: v.refresh_token, access: v.access_token, scade: v.expires_at || Date.now() / 1000 + 3000 }));
}
async function hbLeggi(d) {
  const tok = await hbToken(d);
  if (!tok) return null;
  const h = { apikey: d.teamhb.key, Authorization: `Bearer ${tok}`, "Content-Type": "application/json" };
  const da = oggiIso();
  const [c, r] = await Promise.all([
    fetch(`${d.teamhb.base}/rest/v1/rpc/get_chiamate`, { method: "POST", headers: h, body: JSON.stringify({ p_da: da }) }),
    fetch(`${d.teamhb.base}/rest/v1/richieste_agibilita?select=data,tipo&annullato=is.null&data=gte.${da}&order=data.asc`, { headers: h }),
  ]);
  if (!c.ok) throw new Error(`TeamHB non risponde (${c.status})`);
  const chiamate = await c.json();
  const richieste = r.ok ? await r.json() : [];
  const nome = (x) => (typeof x === "string" ? x : x && typeof x === "object" ? Object.values(x).find((v) => typeof v === "string") || "" : "").trim();
  return {
    quando: new Date(),
    accettate: chiamate.filter((x) => x.risposta === "accettata").map((x) => ({ data: String(x.data).slice(0, 10), azienda: nome(x.azienda_nome) || "Azienda non indicata", da_confermare: !!x.non_confermata })),
    da_rispondere: chiamate.filter((x) => !x.risposta).map((x) => ({ data: String(x.data).slice(0, 10), azienda: nome(x.azienda_nome) })),
    richieste: richieste.filter((x) => x.tipo !== "off").map((x) => String(x.data).slice(0, 10)),
  };
}

// ---------------------------------------------------------------- utilità
const MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
const GG = ["dom", "lun", "mar", "mer", "gio", "ven", "sab"];
const pad = (n) => String(n).padStart(2, "0");
const oggiIso = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dt = (s) => new Date(`${s}T12:00:00`);
const ddmm = (s) => `${s.slice(8, 10)}/${s.slice(5, 7)}`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ckey = (s) => { let n = String(s || "").toLowerCase().replace(/[^\p{L}\p{N}]/gu, ""); for (const x of ["srls", "srl", "spa", "snc", "sas"]) if (n.length > x.length + 2 && n.endsWith(x)) { n = n.slice(0, -x.length); break; } return n; };
const stessa = (a, b) => { const x = ckey(a), y = ckey(b); return !!x && !!y && (x.includes(y) || y.includes(x)); };
const euro = (n) => { const r = Math.round(n * 100) / 100; return r.toLocaleString("it-IT", { minimumFractionDigits: Number.isInteger(r) ? 0 : 2, maximumFractionDigits: 2 }); };
function azienda(titolo) { return String(titolo).split(" · ")[0].trim(); }
function colore(d, nome) {
  if (/^viaggio\b/i.test(nome)) return "var(--viola)";
  const c = (d.colori || {})[ckey(nome)];
  return c || "var(--bright)";
}
function eta(quando) {
  if (!quando) return Infinity;
  const t = new Date(quando.replace(" ", "T"));
  return (Date.now() - t.getTime()) / 60000;
}
function quanto(min) {
  if (!isFinite(min)) return "mai";
  if (min < 2) return "adesso";
  if (min < 60) return `${Math.round(min)} min fa`;
  if (min < 60 * 24) return `${Math.round(min / 60)} h fa`;
  return `${Math.round(min / 1440)} giorni fa`;
}

// ---------------------------------------------------------------- giornate: Mac + TeamHB dal vivo
function giornate() {
  const d = S.dati, L = S.live, oggi = oggiIso();
  const ev = (d.eventi || []).map((e) => ({ ...e }));
  if (L) {
    for (const e of ev) {
      if (!e.stato_hb || (e.fine || e.data) < oggi) continue;
      const giorni = [];
      for (let x = dt(e.data); x <= dt(e.fine || e.data); x.setDate(x.getDate() + 1)) giorni.push(`${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`);
      const az = azienda(e.titolo);
      const viaggio = /^viaggio\b/i.test(az);
      const inCal = giorni.every((g) => L.accettate.some((c) => c.data === g && (viaggio || stessa(c.azienda, az))));
      const rich = giorni.every((g) => L.accettate.some((c) => c.data === g && (viaggio || stessa(c.azienda, az))) || L.richieste.includes(g));
      const nuovo = inCal ? "in_calendario" : rich ? "richiesta" : "mancante";
      if (nuovo !== e.stato_hb) { e.stato_hb = nuovo; e.live = true; }
    }
    for (const c of L.accettate) {
      if (c.data < oggi) continue;
      const c_ = ev.some((e) => e.data <= c.data && c.data <= (e.fine || e.data) && (stessa(azienda(e.titolo), c.azienda) || (e.fonti || []).includes("HB")));
      if (!c_) ev.push({ data: c.data, fine: c.data, titolo: c.azienda, stato_hb: "", fonti: ["HB"], nuova: true, note: c.da_confermare ? "da confermare dall'azienda" : "" });
    }
  }
  ev.sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : String(a.titolo).localeCompare(b.titolo)));
  return ev;
}

// ---------------------------------------------------------------- viste
function rigaEvento(d, e, oggi) {
  const a = dt(e.data), multi = e.fine && e.fine !== e.data;
  const quando = multi ? `${ddmm(e.data)}<br>→ ${ddmm(e.fine)}` : `<span class="wd">${GG[a.getDay()]}</span>${ddmm(e.data)}`;
  const az = azienda(e.titolo), resto = String(e.titolo).slice(az.length).replace(/^ · /, "");
  const viaggio = /^viaggio\b/i.test(az);
  const sq = viaggio ? `<span class="sq viaggio" title="viaggio"></span>` : e.stato_hb ? `<span class="sq ${e.stato_hb}" title="${({ in_calendario: "in calendario TeamHB", richiesta: "agibilità richiesta", mancante: "né in calendario né richiesta" })[e.stato_hb]}"></span>` : "";
  const fonti = (e.fonti || []).join("+");
  const luogo = e.luogo ? esc(e.luogo) : "";
  return `<div class="row"><div class="when">${quando}</div><div class="what">
    <div class="tit">${sq}<span class="az" style="color:${colore(d, az)}">${esc(az)}</span>${resto ? `<span class="resto">· ${esc(resto)}</span>` : ""}</div>
    <div class="meta">${fonti ? `<span class="tag">${esc(fonti)}</span>` : ""}${e.nuova ? `<span class="tag nuova">NUOVA SU TEAMHB</span>` : ""}${e.live ? `<span class="tag live">AGGIORNATO ORA</span>` : ""}${luogo ? `<span>${luogo}</span>` : ""}</div>
  </div></div>`;
}
/** "Hollywood Service Italia S.r.l." → "Hollywood Service Italia" */
const corto = (n) => String(n).replace(/[\s,]*(s\.?\s?r\.?\s?l\.?s?|s\.?\s?p\.?\s?a\.?|s\.?n\.?c\.?|s\.?a\.?s\.?)\s*$/i, "").trim();
/** seconda casella di un lavoro di più giorni: tour/artista dalle note, altrimenti la città o il posto */
function info(e) {
  const n = String(e.note || "");
  const m = n.match(/(?:Artista \/ evento|Tour|Produzione|Evento):\s*([^\n]+)/i);
  if (m) return m[1].trim();
  const resto = String(e.titolo).split(" · ").slice(1).join(" · ");
  return resto || String(e.luogo || "").split(",")[0];
}
/** scritta leggibile sulla barra piena: scura sui colori chiari, bianca sugli scuri */
function contrasto(c) {
  const m = String(c).match(/^#([0-9a-f]{6})/i);
  if (!m) return "#0b0f0d";
  const n = parseInt(m[1], 16), l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  return l > 0.55 ? "#0b0f0d" : "#ffffff";
}
const iso = (x) => `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`;
const GGL = ["L", "M", "M", "G", "V", "S", "D"];

function vistaCal() {
  const d = S.dati, L = S.live, oggi = oggiIso();
  let h = "";
  if (L && L.da_rispondere.length) {
    h += `<div class="banner warn"><div><b>${L.da_rispondere.length === 1 ? "1 chiamata da accettare" : L.da_rispondere.length + " chiamate da accettare"} su TeamHB</b><br>${L.da_rispondere.map((c) => `${ddmm(c.data)} ${esc(c.azienda)}`).join(" · ")}</div></div>`;
  }
  const ev = giornate();
  const mese = S.mese || oggi.slice(0, 7);
  const [Y, M] = mese.split("-").map(Number);
  const primo = new Date(Y, M - 1, 1, 12);
  const inizio = new Date(primo); inizio.setDate(1 - ((primo.getDay() + 6) % 7)); // lunedì
  const giorni = new Date(Y, M, 0).getDate();
  const settimane = Math.ceil((((primo.getDay() + 6) % 7) + giorni) / 7);
  const sel = S.giorno && S.giorno.startsWith(mese) ? S.giorno : (oggi.startsWith(mese) ? oggi : `${mese}-01`);
  h += `<div class="mesebar"><button class="freccia" data-mese="-1" aria-label="Mese prima">‹</button>
    <button class="mtit" data-mese="0">${MESI[M - 1]} <span>${Y}</span></button>
    <button class="freccia" data-mese="1" aria-label="Mese dopo">›</button></div>
    <div class="griglia"><div class="gg">${GGL.map((g, i) => `<span${i > 4 ? ' class="we"' : ""}>${g}</span>`).join("")}</div>`;
  const x = new Date(inizio);
  for (let w = 0; w < settimane; w++) {
    const g0 = iso(x), g6 = iso(new Date(x.getTime() + 6 * 864e5));
    // lavori di questa settimana, ognuno su una corsia: un'unica barra anche su più giorni
    const pezzi = ev.filter((e) => e.data <= g6 && (e.fine || e.data) >= g0)
      .map((e) => ({ e, c0: Math.max(0, Math.round((dt(e.data) - dt(g0)) / 864e5)), c1: Math.min(6, Math.round((dt(e.fine || e.data) - dt(g0)) / 864e5)) }))
      .sort((p, q) => p.c0 - q.c0 || (q.c1 - q.c0) - (p.c1 - p.c0));
    const corsie = [];
    for (const p of pezzi) { let l = corsie.findIndex((fine) => fine < p.c0); if (l < 0) { l = corsie.length; corsie.push(-1); } corsie[l] = p.c1; p.l = l; }
    const nascosti = Array(7).fill(0);
    let barre = "";
    for (const p of pezzi) {
      if (p.l > 2) { for (let c = p.c0; c <= p.c1; c++) nascosti[c]++; continue; }
      const e = p.e, az = azienda(e.titolo), viaggio = /^viaggio\b/i.test(az);
      const st = viaggio ? "viaggio" : e.stato_hb || "";
      const lungo = p.c1 > p.c0, inf = viaggio ? "" : info(e);
      const testo = viaggio ? "Viaggio" : lungo && inf ? `${corto(az)} · ${inf}` : corto(az);
      const apre = e.data >= g0, chiude = (e.fine || e.data) <= g6;
      const cc = colore(d, az);
      barre += `<span class="barra${apre ? " a" : ""}${chiude ? " b" : ""}${lungo ? "" : " uno"}" style="--c:${cc};--tc:${contrasto(cc)};${!lungo && st && st !== "viaggio" ? `--st:var(--${({ in_calendario: "green", richiesta: "amber", mancante: "red" })[st]});` : ""}left:calc(${p.c0} * 100% / 7 + 2px);width:calc(${p.c1 - p.c0 + 1} * 100% / 7 - 4px);top:calc(24px + ${p.l} * 27px)">${st ? `<i class="sq ${st}"></i>` : ""}<b>${esc(testo)}</b></span>`;
    }
    const righe = Math.max(1, Math.min(3, corsie.length));
    h += `<div class="sett" style="--alt:${30 + righe * 27}px">`;
    for (let i = 0; i < 7; i++) {
      const g = iso(x), fuori = x.getMonth() !== M - 1;
      const cls = ["cella", fuori ? "fuori" : "", g === oggi ? "oggi" : "", g === sel ? "sel" : "", i > 4 ? "we" : "", g < oggi ? "passato" : ""].filter(Boolean).join(" ");
      h += `<button class="${cls}" data-giorno="${g}"><span class="num">${x.getDate()}</span>${nascosti[i] ? `<span class="altri">+${nascosti[i]}</span>` : ""}</button>`;
      x.setDate(x.getDate() + 1);
    }
    h += `${barre}</div>`;
  }
  h += `</div>`;
  const delGiorno = ev.filter((e) => e.data <= sel && sel <= (e.fine || e.data));
  const sd = dt(sel);
  h += `<h2>${["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"][sd.getDay()]} ${sd.getDate()} ${MESI[sd.getMonth()]}${sel === oggi ? " · oggi" : ""}</h2>`;
  h += delGiorno.length ? `<div class="list">${delGiorno.map((e) => rigaEvento(d, e, oggi)).join("")}</div>` : `<div class="vuoto">${sel < oggi ? "Niente in questo giorno." : "Libero."}</div>`;
  return h;
}

function inAttesa() { return getJ(K.attesa, []); }
function vistaViaggi() {
  const d = S.dati;
  const att = inAttesa();
  const da = (d.viaggi || []).filter((v) => !v.scelta && v.tipo !== "stesso_giorno" && v.data >= oggiIso());
  let h = `<h2>Viaggi da decidere</h2>`;
  if (!da.length) h += `<div class="vuoto">Nessun viaggio da decidere.</div>`;
  else {
    h += `<div class="cards">`;
    for (const v of da) {
      const giaInviata = att.find((a) => a.viaggio === v.id);
      const s = S.scelte[v.id] || "";
      const occ = (v.occupato || []).length;
      const opz = occ ? [["sostituisci", "CAMBIA"], ["aggiungi", "AGGIUNGI"], ["no", "NO"]] : [["si", "INSERISCI"], ["no", "NO"]];
      h += `<div class="card"><div class="v-top"><span class="v-data">${GG[dt(v.data).getDay()]} ${ddmm(v.data)}</span><span class="v-tipo">${esc(({ andata: "andata", ritorno: "ritorno", trasferimento: "trasferimento" })[v.tipo] || v.tipo)}</span></div>
        <div class="v-tratta">${esc(v.da)}<span>→</span>${esc(v.a)}</div>
        ${v.tour ? `<div class="meta">${esc(v.tour)}</div>` : ""}

        ${giaInviata ? `<div class="attesa">Scelta inviata (${esc(({ si: "inserisci", no: "no", sostituisci: "cambia", aggiungi: "aggiungi" })[giaInviata.scelta])}): la esegue il Mac al prossimo sync.</div>` :
        `<div class="scelte">${opz.map(([k, t]) => `<button class="btn${s === k ? " on" : ""}${k === "no" ? " no" : ""}" data-viaggio="${esc(v.id)}" data-scelta="${k}">${t}</button>`).join("")}</div>`}
      </div>`;
    }
    h += `</div>`;
    const n = Object.keys(S.scelte).length;
    h += `<div style="margin-top:14px"><button class="btn prim wide" id="invia" ${n ? "" : "disabled"}>${n ? `INVIA ${n === 1 ? "1 SCELTA" : n + " SCELTE"}` : "INVIA"}</button></div>`;
    if (!get(K.token)) h += `<p class="nota">Per inviare le scelte al Mac serve il token GitHub (da STATO).</p>`;

  if (fatte.length) {
    h += `<h2>Viaggi in calendario</h2><div class="list">` + fatte.map((v) => `<div class="row"><div class="when"><span class="wd">${GG[dt(v.data).getDay()]}</span>${ddmm(v.data)}</div><div class="what"><div class="tit"><span class="sq viaggio"></span><span class="resto">${esc(v.da)} → ${esc(v.a)}</span></div></div></div>`).join("") + `</div>`;
  }
  return h;

  } else {

      <form id="hb-form" class="cards"><div class="campo"><label for="hb-email">Email TeamHB</label><input id="hb-email" type="email" autocomplete="username" value="${esc((d.teamhb || {}).email || "")}"></div>

// ---------------------------------------------------------------- disegno
function intestazione() {
  const d = S.dati;
  const min = eta(d && d.stato && d.stato.quando);
  const cls = !d ? "warn" : min > 120 ? "warn" : d.stato && d.stato.ok === false ? "err" : "";
  const live = S.live && !S.liveErr ? " · TeamHB dal vivo" : "";
  return `<header class="top"><img class="logo" src="icona.png" alt="">
    <div><div class="brand">Mergerito</div><div class="sub"><span class="dot ${cls}"></span>${d ? `Mac ${quanto(min)}${live}${S.letto ? ` · letto ${pad(S.letto.getHours())}:${pad(S.letto.getMinutes())}` : ""}` : "…"}</div></div>
    <button class="ref${S.carico ? " spin" : ""}" id="ref" aria-label="Aggiorna"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button></header>`;
}

function disegna() {

      <div class="campo"><label for="tok">Token GitHub</label><input id="tok" type="password" autocomplete="off" ${get(K.token) ? 'placeholder="salvato (lascia vuoto)"' : 'placeholder="github_pat_…"'}></div>

  const min = eta(S.dati.stato && S.dati.stato.quando);
  if (min > 120) h += `<div class="banner warn"><div>Il Mac non sincronizza da ${quanto(min).replace(" fa", "")}: ShiftSync e viaggi sono fermi a quell'ora.${S.live ? " TeamHB è aggiornato dal telefono." : ""}</div></div>`;
  if (S.liveErr && S.vista !== "stato") h += `<div class="banner warn"><div>TeamHB dal telefono: ${esc(S.liveErr)}</div></div>`;

// ---------------------------------------------------------------- caricamento
/** versione della pagina, scritta dal Mac quando la carica su GitHub */
const PAGINA = "7.6.0";

/** silenzioso = controllo automatico: niente rotellina, ridisegna solo se è cambiato qualcosa */
async function carica(silenzioso) {
  if (S.carico || !S.frase) return;
  S.carico = !silenzioso; if (!silenzioso) disegna();
  let cambiato = !silenzioso;
  try {
    const testo = await scaricaDati();
    if (testo !== S._testo) { S.dati = await decifra(S.frase, testo); S._testo = testo; cambiato = true; }
    // pagina nuova su GitHub: la ricarico da sola (al massimo ogni 5 minuti, GitHub Pages ci mette un po')
    if (S.dati.versione && !PAGINA.startsWith("__") && S.dati.versione !== PAGINA) {
      let t = 0; try { t = +sessionStorage.getItem("mg_ricarica") || 0; } catch {}
      if (Date.now() - t > 300000) { try { sessionStorage.setItem("mg_ricarica", Date.now()); } catch {} location.reload(); return; }
    }
    S.letto = new Date();
    set(K.cache, testo);
    S.errore = "";
    // scelte già eseguite dal Mac: tolte dall'attesa
    const fatte = new Set((S.dati.esiti || []).map((e) => e.id));
    set(K.attesa, JSON.stringify(inAttesa().filter((a) => !fatte.has(a.id) && Date.now() - a.t < 3 * 864e5)));
  } catch (e) {
    S.errore = e.message;
    if (e.message === "frase segreta sbagliata") { S.frase = ""; set(K.frase, ""); }
    if (/token GitHub non valido/.test(e.message)) set(K.token, "");
    else if (!S.dati && get(K.cache)) { try { S.dati = await decifra(S.frase, get(K.cache)); } catch {} }
  }
  // TeamHB dal telefono: a ogni aggiornamento a mano, in automatico ogni 5 minuti
  if (S.dati && getJ(K.hb, null) && (!silenzioso || Date.now() - (S._hb || 0) > 300000)) {
    const prima = JSON.stringify(S.live && { ...S.live, quando: 0 });
    try { S.live = await hbLeggi(S.dati); S.liveErr = ""; S._hb = Date.now(); } catch (e) { S.liveErr = e.message; }
    if (JSON.stringify(S.live && { ...S.live, quando: 0 }) !== prima) cambiato = true;
  }
  S.carico = false;
  if (cambiato || !silenzioso) disegna();
}

async function inviaScelte() {
  const t = get(K.token), r = repo();
  if (!t || !r) { S.invio = "Manca il token GitHub: inseriscilo in STATO."; disegna(); return; }
  const nuove = Object.entries(S.scelte).map(([viaggio, scelta]) => ({ id: `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`, tipo: "viaggio", viaggio, scelta, t: Date.now() }));
  const url = `${API}/repos/${r}/contents/azioni.json`;
  const h = { Authorization: `Bearer ${t}`, Accept: "application/vnd.github+json" };
  try {
    for (let prova = 0; prova < 2; prova++) {
      let sha, azioni = [];
      const g = await fetch(`${url}?t=${Date.now()}`, { headers: h, cache: "no-store" });
      if (g.ok) {
        const v = await g.json(); sha = v.sha;
        try { azioni = (await decifra(S.frase, decodeURIComponent(escape(atob(v.content.replace(/\s/g, "")))))).azioni || []; } catch {}
      } else if (g.status === 401) throw new Error("token GitHub non valido");
      azioni = azioni.concat(nuove);
      const body = { message: "scelte dall'iPhone", content: btoa(unescape(encodeURIComponent(await cifra(S.frase, { azioni })))) };
      if (sha) body.sha = sha;
      const p = await fetch(url, { method: "PUT", headers: { ...h, "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (p.ok) {
        set(K.attesa, JSON.stringify(inAttesa().concat(nuove)));
        S.scelte = {};
        S.invio = `Inviat${nuove.length === 1 ? "a 1 scelta" : "e " + nuove.length + " scelte"}: il Mac le esegue al prossimo sync (ogni 15 minuti, quando è acceso).`;
        disegna(); return;
      }
      if (p.status !== 409 && p.status !== 422) throw new Error(`GitHub ha risposto ${p.status}`);
    }
    throw new Error("file cambiato mentre scrivevo, riprova");
  } catch (e) { S.invio = `Non inviate: ${e.message}`; disegna(); }
}

// ---------------------------------------------------------------- eventi
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.v) { S.vista = b.dataset.v; set(K.vista, S.vista); S.invio = ""; disegna(); scrollTo(0, 0); return; }
  if (b.id === "ref") return carica();
  if (b.dataset.mese !== undefined) {
    const oggi = oggiIso(), [y, m] = (S.mese || oggi.slice(0, 7)).split("-").map(Number), k = +b.dataset.mese;
    const n = k === 0 ? new Date() : new Date(y, m - 1 + k, 1);
    S.mese = `${n.getFullYear()}-${pad(n.getMonth() + 1)}`; S.giorno = k === 0 ? oggi : ""; disegna(); return;
  }
  if (b.dataset.giorno) { S.giorno = b.dataset.giorno; const m = S.giorno.slice(0, 7); if (m !== (S.mese || oggiIso().slice(0, 7))) S.mese = m; disegna(); return; }
  if (b.dataset.viaggio) { const id = b.dataset.viaggio, k = b.dataset.scelta; if (S.scelte[id] === k) delete S.scelte[id]; else S.scelte[id] = k; S.invio = ""; disegna(); return; }
  if (b.id === "invia") return inviaScelte();
  if (b.id === "hb-esci") { set(K.hb, ""); S.live = null; S.liveErr = ""; disegna(); return; }
  if (b.id === "blocca") { S.frase = ""; set(K.frase, ""); S.dati = null; S._testo = null; S.live = null; disegna(); return; }
});
document.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === "lock-form") {
    const r = document.getElementById("repo").value.trim().replace(/^https:\/\/github\.com\//, "").replace(/\/$/, "");
    if (r && r !== repo()) set(K.repo, r);
    const fr = document.getElementById("frase").value, tk = document.getElementById("tok").value.trim();
    if (fr) { S.frase = fr; set(K.frase, fr); }
    if (tk) set(K.token, tk);
    S.errore = "";
    if (S.frase && get(K.token)) { S.dati = null; S._testo = null; disegna(); carica(); } else { S.errore = !S.frase ? "scrivi la frase segreta" : "scrivi il token GitHub"; disegna(); }
  } else if (f.id === "hb-form") {
    try { await hbLogin(S.dati, document.getElementById("hb-email").value.trim(), document.getElementById("hb-pw").value); S.liveErr = ""; carica(); }
    catch (e) { S.liveErr = e.message; disegna(); }
  } else if (f.id === "tok-form") {
    const v = document.getElementById("tok").value.trim();
    if (v) { set(K.token, v); disegna(); }
  }
});
// si aggiorna da sola: appena torni sull'app e poi ogni minuto mentre è aperta
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.dati) carica(true); });
setInterval(() => { if (!document.hidden && S.dati) carica(true); }, 60000);

(async function avvio() {
  if (S.frase && get(K.cache)) { try { S.dati = await decifra(S.frase, get(K.cache)); } catch {} }
  disegna();
  S._ultimo = Date.now();
  carica();
})();
</script>
